name: Set up Python
description: Installs uv, provisions the interpreter and syncs the requested dependency groups.

inputs:
  python-version:
    description: Interpreter version to provision.
    required: false
    default: "3.14"
  groups:
    description: Space-separated dependency groups to sync.
    required: false
    default: dev
  sync:
    description: >-
      Whether to sync dependencies. Turn it off for jobs that only need the uv
      toolchain, such as refreshing a lock that is deliberately out of date.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Provision the interpreter
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv python install "$PYTHON_VERSION"

    - name: Sync dependencies
      if: inputs.sync == 'true'
      shell: bash
      env:
        GROUPS: ${{ inputs.groups }}
      run: |
        set -euo pipefail
        arguments=()
        for group in $GROUPS; do
          arguments+=(--group "$group")
        done
        uv sync "${arguments[@]}"
