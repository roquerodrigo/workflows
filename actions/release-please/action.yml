name: Release Please
description: Runs release-please as a library, with the notes of the release already written.

# googleapis/release-please-action offers no way to hand release-please the notes,
# which leaves a later job to rewrite a pull request that is already open. Here the
# text is in place on the first write, and on every update after it.

inputs:
  phase:
    description: >-
      "releases" tags the release pull request that was merged, "pull-requests"
      opens or updates the one for the next release.
    required: true
  token:
    description: Token with contents and pull-requests write access.
    required: true
  configuration:
    description: Path to the release-please configuration.
    required: false
    default: release-please-config.json
  manifest:
    description: Path to the release-please manifest.
    required: false
    default: .release-please-manifest.json
  notes-file:
    description: Notes written by actions/release-notes. Without it, release-please writes its own text.
    required: false
    default: ""

outputs:
  release-created:
    description: "\"true\" when a tag was cut, in the releases phase."
    value: ${{ steps.run.outputs.release-created }}
  tag-name:
    description: Tag created, if any, in the releases phase.
    value: ${{ steps.run.outputs.tag-name }}
  release-pr:
    description: JSON describing the pull request opened or updated, if any, in the pull-requests phase.
    value: ${{ steps.run.outputs.release-pr }}

runs:
  using: composite
  steps:
    - name: Provision Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Install release-please
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    - name: Run release-please
      id: run
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PHASE: ${{ inputs.phase }}
        REPOSITORY: ${{ github.repository }}
        RELEASE_TOKEN: ${{ inputs.token }}
        CONFIGURATION: ${{ inputs.configuration }}
        MANIFEST: ${{ inputs.manifest }}
        NOTES_FILE: ${{ inputs.notes-file }}
      run: node src/main.js
