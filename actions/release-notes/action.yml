name: Release notes
description: Writes the notes of the next release for the people who use the project.

# Each step receives only the credential it needs: the step that calls the model
# never sees a GitHub token. The notes are left in a file for whoever opens the
# release pull request, which is the only place that holds a token that can write.

inputs:
  repository:
    description: Repository of the release, as owner/name.
    required: true
  configuration:
    description: Path to the release-please configuration.
    required: false
    default: release-please-config.json
  manifest:
    description: Path to the release-please manifest.
    required: false
    default: .release-please-manifest.json
  previous-tag:
    description: With release-tag, writes the notes of that past release and prints them to the job summary.
    required: false
    default: ""
  release-tag:
    description: Tag of a past release to write the notes of, instead of the next release.
    required: false
    default: ""
  read-token:
    description: Token that reads the commits and pull requests of the repository.
    required: true
  anthropic-api-key:
    description: Key for the Claude API.
    required: true

outputs:
  state:
    description: >-
      "ready" when the notes file was written, "unchanged" when the open release
      pull request already carries these notes, "absent" when this release keeps
      the text release-please writes.
    value: ${{ steps.collect.outputs.state }}
  pull-request:
    description: JSON describing the open release pull request, when the state is "unchanged".
    value: ${{ steps.collect.outputs.pull-request }}
  notes-file:
    description: Path to the notes, when the state is "ready".
    value: ${{ steps.compose.outputs.notes-file }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Collect the commits of the release
      id: collect
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.read-token }}
        REPOSITORY: ${{ inputs.repository }}
        CONFIGURATION: ${{ inputs.configuration }}
        MANIFEST: ${{ inputs.manifest }}
        PREVIOUS_TAG: ${{ inputs.previous-tag }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: >-
        uv run --frozen --no-dev python -m release_notes collect
        --repository "$REPOSITORY"
        --configuration "$CONFIGURATION"
        --manifest "$MANIFEST"
        --previous-tag "$PREVIOUS_TAG"
        --release-tag "$RELEASE_TAG"
        --source "$RUNNER_TEMP/release-source.json"

    - name: Write the notes
      id: compose
      if: steps.collect.outputs.state == 'ready'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: >-
        uv run --frozen --no-dev python -m release_notes compose
        --source "$RUNNER_TEMP/release-source.json"
        --notes "$RUNNER_TEMP/release-notes.json"

    - name: Print the notes to the job summary
      if: steps.collect.outputs.state == 'ready' && inputs.release-tag != ''
      shell: bash
      working-directory: ${{ github.action_path }}
      run: >-
        uv run --frozen --no-dev python -m release_notes preview
        --source "$RUNNER_TEMP/release-source.json"
        --notes "$RUNNER_TEMP/release-notes.json"
        | tee -a "$GITHUB_STEP_SUMMARY"
