name: Release Please

# Tags the release pull request once it is merged, and grooms the next one from the
# conventional commits on the default branch. Publishing is a separate concern:
# compose this with publish-pypi.yml or publish-npm.yml.
#
# With an API key, the notes of the next release are written before its pull request
# is touched, so that pull request only ever shows the final text. Version, tag and
# files stay with release-please.

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the release-please configuration.
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: Path to the release-please manifest.
        required: false
        type: string
        default: .release-please-manifest.json
    secrets:
      release-token:
        description: >-
          Token with contents and pull-requests write access. Falls back to the
          default GITHUB_TOKEN, whose pushes do not trigger workflows — a
          release pull request opened with it keeps stale checks.
        required: false
      anthropic-api-key:
        description: >-
          Key for the Claude API. Without it, the release pull request carries the
          notes release-please writes.
        required: false
    outputs:
      release-created:
        description: "\"true\" when a tag was cut on this run."
        value: ${{ jobs.release.outputs.release-created }}
      tag-name:
        description: Tag created by this run, if any.
        value: ${{ jobs.release.outputs.tag-name }}
      release-pr:
        description: JSON describing the open release pull request, if any.
        value: ${{ jobs.pull-request.outputs.release-pr || jobs.notes.outputs.release-pr }}

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release-created }}
      tag-name: ${{ steps.release.outputs.tag-name }}
    steps:
      - name: Tag the merged release
        id: release
        uses: roquerodrigo/workflows/actions/release-please@main
        with:
          phase: releases
          token: ${{ secrets.release-token || github.token }}
          configuration: ${{ inputs.config-file }}
          manifest: ${{ inputs.manifest-file }}

  notes:
    name: Release notes
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.result.outputs.state }}
      notes: ${{ steps.result.outputs.notes }}
      release-pr: ${{ steps.notes.outputs.pull-request }}
    steps:
      - name: Check for the API key
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the notes
        id: notes
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        uses: roquerodrigo/workflows/actions/release-notes@main
        with:
          repository: ${{ github.repository }}
          configuration: ${{ inputs.config-file }}
          manifest: ${{ inputs.manifest-file }}
          read-token: ${{ github.token }}
          anthropic-api-key: ${{ secrets.anthropic-api-key }}

      # Job outputs hold one line, hence the encoding on the way to the next job.
      - name: Hand the notes over
        id: result
        env:
          OUTCOME: ${{ steps.notes.outcome }}
          STATE: ${{ steps.notes.outputs.state }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
        run: |
          if [ "$OUTCOME" = "failure" ]; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
          else
            echo "state=$STATE" >> "$GITHUB_OUTPUT"
          fi
          if [ "$OUTCOME" = "success" ] && [ "$STATE" = "ready" ]; then
            echo "notes=$(base64 --wrap=0 "$NOTES_FILE")" >> "$GITHUB_OUTPUT"
          fi

  pull-request:
    name: Release pull request
    needs: [release, notes]
    if: needs.notes.outputs.state != 'unchanged'
    # A release already cut has its publishing job waiting on this workflow, and a
    # pull request that can wait for the next push is no reason to hold it back.
    continue-on-error: ${{ needs.release.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-pr: ${{ steps.pull-request.outputs.release-pr }}
    steps:
      - name: Leave the pull request alone without its notes
        if: needs.notes.outputs.state == 'failed'
        run: |
          echo "::error::The release notes could not be written, so the release pull request was left as it is. The next push tries again."
          exit 1

      - name: Receive the notes
        id: notes
        if: needs.notes.outputs.state == 'ready'
        env:
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          base64 --decode <<< "$NOTES" > "$RUNNER_TEMP/release-notes.json"
          echo "file=$RUNNER_TEMP/release-notes.json" >> "$GITHUB_OUTPUT"

      - name: Groom the release pull request
        id: pull-request
        uses: roquerodrigo/workflows/actions/release-please@main
        with:
          phase: pull-requests
          token: ${{ secrets.release-token || github.token }}
          configuration: ${{ inputs.config-file }}
          manifest: ${{ inputs.manifest-file }}
          notes-file: ${{ steps.notes.outputs.file }}
