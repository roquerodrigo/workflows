name: Repository policy

# Neither branch protection nor the merge settings drift on their own — they go
# missing. A repository created after a convention was agreed simply never
# receives it, which is how three integrations ended up with an unprotected
# default branch, three others with secret scanning off, and three still
# accepting a squash merge the release tooling does not expect. A weekly
# reconcile closes that gap without anyone having to notice it, and the run
# summary names every public repository that is not declared yet, so a new one
# surfaces instead of staying invisible.
#
# The schedule applies. A manual run only reports unless `apply` is ticked, which
# is how a change to repository-policy.json gets reviewed before it lands.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Write the changes instead of only reporting them.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  reconcile:
    name: Reconcile branch protection
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconcile
        env:
          # The default GITHUB_TOKEN is scoped to this repository alone and
          # cannot administer the others.
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
          APPLY: ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python3 scripts/reconcile-repository-policy.py $APPLY | tee -a "$GITHUB_STEP_SUMMARY"
