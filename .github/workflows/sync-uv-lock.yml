name: Sync uv.lock

# release-please rewrites `version` in pyproject.toml but ships no updater that
# understands uv.lock, so the lock keeps the previous version and `uv lock
# --check` fails on the default branch from the moment the release lands.
# Regenerating it on the release branch is what keeps the two in step.
#
# Declaring uv.lock under release-please's `extra-files` as a toml/jsonpath
# entry does not work: the file is fetched and then skipped with "No entries
# modified". The entry looks like coverage and provides none.

on:
  workflow_call:
    inputs:
      release-pr:
        description: JSON describing the release pull request, as emitted by release-please.
        required: true
        type: string
      python-version:
        description: Interpreter version used to resolve the lock.
        required: false
        type: string
        default: "3.14"
    secrets:
      release-token:
        description: >-
          Token used to push the refreshed lock. The default GITHUB_TOKEN is not
          enough: pushes authenticated with it do not trigger workflows, so the
          release pull request would sit with stale checks.
        required: true

permissions: {}

jobs:
  sync:
    name: Sync uv.lock
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.release-pr).headBranchName }}
          token: ${{ secrets.release-token }} # zizmor: ignore[artipacked]

      - name: Set up Python
        uses: roquerodrigo/workflows/actions/setup-python@main
        with:
          python-version: ${{ inputs.python-version }}
          sync: "false"

      - name: Refresh the lock
        run: uv lock

      - name: Commit the lock
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync the lockfile with the release version"
          git push
