name: Node build

on:
  workflow_call:
    inputs:
      node-version:
        description: Node major version to build against.
        required: false
        type: string
        default: "24"
      script:
        description: npm script that produces the build.
        required: false
        type: string
        default: build

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: roquerodrigo/workflows/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        env:
          SCRIPT: ${{ inputs.script }}
        run: npm run "$SCRIPT"
