version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/setup-python
      - /actions/setup-node
      - /actions/release-notes
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /actions/release-notes
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      release-notes:
        patterns: ["*"]
