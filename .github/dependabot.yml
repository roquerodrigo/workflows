version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /actions/setup-python
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"

      include: "scope"

  - package-ecosystem: github-actions
    directory: /actions/setup-node
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      include: "scope"
